<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In — CS Data</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink&family=Instrument+Serif:ital@0;1&family=Grechen+Fuemen&family=Karla:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <canvas id="matrixCanvas"></canvas>

  <div class="page">
    <div id="topbarPlaceholder"></div>

    <div class="login-wrap" style="flex:1">
      <div class="login-card">
        <div class="login-icon">🎓</div>
        <h1>Sign In</h1>
        <p>Sign in with your university account</p>

        <button class="btn btn-primary btn-block" id="msLoginBtn" style="height:56px;font-size:16px;margin-top:8px">
          <span style="font-size:20px">🪟</span>
          Sign in with Microsoft
        </button>

        <div class="login-hint" style="margin-top:24px">
          🔒 Only <strong>@science.tanta.edu.eg</strong> accounts are allowed
        </div>

        <div style="text-align:center;margin-top:20px">
          <a href="index.html" style="color:var(--muted);font-size:13px;font-weight:600">← Back to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mappers.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mockApi.js" defer></script>
  <script src="js/matrix.js" defer></script>
  <script src="js/topbar.js" defer></script>
  <script src="js/pages/login.js" defer></script>
</body>
</html>
