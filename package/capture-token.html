<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in...</title>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div class="page">
    <div class="login-wrap" style="flex:1">
      <div class="login-card">
        <div class="login-icon">🔑</div>
        <h1>Signing in...</h1>
        <p id="status">Please wait</p>
        <div class="loader" style="margin: 20px auto"></div>
        <p id="debug" style="font-size:11px;color:var(--muted);margin-top:20px;word-break:break-all"></p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mappers.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function() {
      var status = document.getElementById('status');
      var debug = document.getElementById('debug');
      var params = new URLSearchParams(location.search);

      debug.textContent = 'URL: ' + location.href.substring(0, 200);

      // ✨ انتظر لحظة — الباك ممكن يكون عمل Set-Cookie
      status.textContent = 'Verifying session...';

      setTimeout(function() {
        // جرّب تجيب البروفايل مباشرة
        fetch('/v1/student/profile', { credentials: 'include' })
          .then(function(res) {
            debug.textContent += '\nProfile status: ' + res.status;
            if (res.ok) {
              return res.json();
            }
            throw new Error('Profile fetch failed: ' + res.status);
          })
          .then(function(data) {
            debug.textContent += '\n✅ Profile loaded';
            status.textContent = '✅ Signed in! Redirecting...';
            status.style.color = 'var(--success)';

            // خزّن الـ session
            if (data && data.data) {
              localStorage.setItem('cs_session', JSON.stringify({
                id: data.data.userId,
                name: data.data.name,
                email: data.data.colleageEmail,
                role: data.data.role,
                photo: data.data.photo
              }));
            }

            setTimeout(function() {
              if (data && data.data && (data.data.role === 'owner' || data.data.role === 'moderator' || data.data.role === 'doctor')) {
                location.href = 'intro.html';
              } else {
                location.href = 'intro.html';
              }
            }, 800);
          })
          .catch(function(err) {
            debug.textContent += '\n❌ ' + err.message;
            status.textContent = 'Session failed — retrying...';
            status.style.color = 'var(--danger)';

            setTimeout(function() {
              location.href = 'login.html';
            }, 3000);
          });
      }, 500);
    })();
  </script>
</body>
</html>
