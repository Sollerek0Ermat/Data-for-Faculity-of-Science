<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Set Password — CS Data</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink&family=Instrument+Serif:ital@0;1&family=Grechen+Fuemen&family=Karla:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <canvas id="matrixCanvas"></canvas>

  <div class="page">
    <div id="topbarPlaceholder"></div>

    <div class="login-wrap" style="flex:1">
      <div class="login-card">
        <div class="login-icon">🔑</div>
        <h1>Set Your Password</h1>
        <p>Create a password for your account</p>

        <form id="setPwdForm">
          <div class="field">
            <label for="newPwd">New Password</label>
            <input type="password" id="newPwd" placeholder="••••••••" required minlength="6">
          </div>

          <div class="field">
            <label for="confirmPwd">Confirm Password</label>
            <input type="password" id="confirmPwd" placeholder="••••••••" required minlength="6">
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="height:52px;font-size:16px">
            Save Password →
          </button>

          <p id="msg" class="text-center" style="margin-top:12px;font-weight:700;font-size:14px;min-height:20px"></p>
        </form>

        <div class="login-hint" style="margin-top:24px">
          💡 Next time you'll sign in with Microsoft + your password
        </div>

        <div style="text-align:center;margin-top:20px">
          <a href="index.html" style="color:var(--muted);font-size:13px;font-weight:600">← Back to Home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mappers.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mockApi.js" defer></script>
  <script src="js/matrix.js" defer></script>
  <script src="js/topbar.js" defer></script>
  <script src="js/pages/setPassword.js" defer></script>
</body>
</html>
