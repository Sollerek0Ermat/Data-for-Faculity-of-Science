<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In — CS Data</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Karla:wght@300;400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="preload" href="style.css" as="style">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎓%3C/text%3E%3C/svg%3E">
</head>
<body class="dark">
  <canvas id="matrixCanvas" aria-hidden="true"></canvas>

  <div class="page">
    <div id="topbarPlaceholder"></div>

    <div class="login-wrap" style="flex:1">
      <div class="login-card">
        <div class="login-icon">🎓</div>
        <h1>Sign In</h1>
        <p>Sign in with your university account</p>

        <button class="btn btn-primary btn-block" id="msLoginBtn" style="height:56px;font-size:16px;margin-top:8px">
          <svg width="20" height="20" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex-shrink:0"><rect x="0" y="0" width="10.5" height="10.5" fill="#f25022"/><rect x="12.5" y="0" width="10.5" height="10.5" fill="#7fba00"/><rect x="0" y="12.5" width="10.5" height="10.5" fill="#00a4ef"/><rect x="12.5" y="12.5" width="10.5" height="10.5" fill="#ffb900"/></svg>
          Sign in with Microsoft
        </button>

        <div class="login-hint" style="margin-top:24px">
          🔒 Only <strong>@science.tanta.edu.eg</strong> accounts are allowed
        </div>

        <div style="text-align:center;margin-top:20px">
          <a href="index.html" style="color:var(--muted);font-size:13px;font-weight:600">← Back to Home</a>
        </div>
      </div>
    </div>

    <div id="footerPlaceholder"></div>
  </div>

  <script src="js/config.js"        defer></script>
  <script src="js/i18n.js"          defer></script>
  <script src="js/helpers.js"       defer></script>
  <script src="js/ui.js"            defer></script>
  <script src="js/auth.js"          defer></script>
  <script src="js/mappers.js"       defer></script>
  <script src="js/api.js"           defer></script>
<script src="js/matrix.js"        defer></script>
  <script src="js/topbar.js"        defer></script>
  <script src="js/pages/login.js"   defer></script>
</body>
</html>
