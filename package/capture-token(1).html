<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in...</title>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
  <div class="page">
    <div class="login-wrap" style="flex:1">
      <div class="login-card">
        <div class="login-icon">OK</div>
        <h1>Signing in...</h1>
        <p id="status">Please wait</p>
        <div class="loader" style="margin: 20px auto"></div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    (function() {
      var status = document.getElementById('status');
      var params = new URLSearchParams(location.search);
      var token = params.get('token');
      var userStr = params.get('user');
      var error = params.get('error');

      if (error) {
        status.textContent = 'Error: ' + decodeURIComponent(error);
        setTimeout(function() { location.href = 'login.html'; }, 2000);
        return;
      }

      if (!token) {
        status.textContent = 'No token received';
        setTimeout(function() { location.href = 'login.html'; }, 2000);
        return;
      }

      localStorage.setItem('cs_jwt_token', token);

      if (userStr) {
        try {
          var user = JSON.parse(decodeURIComponent(userStr));
          localStorage.setItem('cs_session', JSON.stringify({
            id: user.id,
            name: user.name,
            email: user.email,
            role: user.role,
            photo: user.photo,
            token: token
          }));
          status.textContent = 'Welcome ' + user.name + '!';
        } catch (e) { console.error(e); }
      }

      localStorage.setItem('microsoft_verified', '1');
      localStorage.setItem('microsoft_verified_at', Date.now().toString());

      setTimeout(function() {
        var session = JSON.parse(localStorage.getItem('cs_session') || '{}');
        if (session.role === 'owner' || session.role === 'moderator' || session.role === 'doctor') {
          location.href = 'admin-login.html';
        } else {
          location.href = 'index.html';
        }
      }, 800);
    })();
  </script>
</body>
</html>
