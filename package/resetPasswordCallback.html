<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset Password - DATA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Karla:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎓%3C/text%3E%3C/svg%3E">
</head>
<body class="dark">

  <div class="page">
    <div id="topbarPlaceholder"></div>

    <div class="login-wrap" style="flex:1">
      <div class="login-card">
        <div class="login-icon">🔑</div>
        <h1>Verifying...</h1>
        <p id="statusMsg">Please wait while we verify your Microsoft account</p>
        <div class="loader" style="margin: 20px auto"></div>
      </div>
    </div>

    <div id="footerPlaceholder"></div>
  </div>

  <script src="js/config.js"        defer></script>
  <script src="js/i18n.js"          defer></script>
  <script src="js/helpers.js"       defer></script>
  <script src="js/ui.js"            defer></script>
  <script src="js/auth.js"          defer></script>
  <script src="js/mappers.js"       defer></script>
  <script src="js/api.js"           defer></script>
  <script src="js/matrix.js"        defer></script>
  <script src="js/topbar.js"        defer></script>
  <script>
    // ✅ سكربت صغير للتعامل مع الـ callback من Microsoft
    (function () {
      'use strict';

      const params = new URLSearchParams(location.search);
      const statusMsg = document.getElementById('statusMsg');

      // الباك ممكن يرجع:
      // 1. token مباشرة: ?token=xxx
      // 2. error: ?error=xxx
      // 3. أو يـ redirect لـ setPassword.html?token=xxx

      const token = params.get('token');
      const error = params.get('error');

      if (error) {
        statusMsg.textContent = '❌ ' + decodeURIComponent(error);
        statusMsg.style.color = 'var(--danger)';
        setTimeout(() => { location.href = 'admin-login.html'; }, 3000);
        return;
      }

      if (token) {
        statusMsg.textContent = '✅ Verified! Redirecting...';
        statusMsg.style.color = 'var(--success)';
        setTimeout(() => {
          location.href = 'setPassword.html?token=' + encodeURIComponent(token);
        }, 800);
        return;
      }

      // مفيش token ومفيش error — يمكن الباك عمل redirect مباشرة أو حاجة تانية
      statusMsg.textContent = 'No token received. Please try again.';
      setTimeout(() => { location.href = 'admin-login.html'; }, 3000);
    })();
  </script>
</body>
</html>
