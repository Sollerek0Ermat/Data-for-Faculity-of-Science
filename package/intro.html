<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Data — Loading...</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg-deep:#060D1A;--bg-navy:#0A192F;--bg-gradient:#04102A;--card-bg:rgba(13,27,42,.75);--cyan:#00E5FF;--blue:#078CFF;--blue-soft:#64B5F6;--cyan-light:#7FEAFF;--white:#FFFFFF;--text:#EAF2FA;--text-soft:#D5E5F5;--muted:#A9BED3;--line:rgba(31,213,255,.28);--cyan-border:rgba(0,229,255,.25);--cyan-glow:rgba(0,229,255,.4);--cyan-glow-soft:rgba(0,229,255,.15);--cyan-border-hover:rgba(0,229,255,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg-deep);color:var(--text);overflow:hidden}
body{background:radial-gradient(1200px 600px at 80% 10%,rgba(10,58,134,.35),transparent 60%),radial-gradient(900px 500px at 10% 90%,rgba(0,60,140,.25),transparent 60%),linear-gradient(180deg,#04102A 0%,#060D1A 60%,#0A192F 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;transition:opacity .5s ease,transform .5s ease}
#bg{z-index:0;opacity:.5}
#fx{z-index:2}
#frame{position:fixed;inset:14px;z-index:4;pointer-events:none;opacity:.5;background:
linear-gradient(var(--cyan),var(--cyan)) top left/24px 1px,linear-gradient(var(--cyan),var(--cyan)) top left/1px 24px,
linear-gradient(var(--cyan),var(--cyan)) top right/24px 1px,linear-gradient(var(--cyan),var(--cyan)) top right/1px 24px,
linear-gradient(var(--cyan),var(--cyan)) bottom left/24px 1px,linear-gradient(var(--cyan),var(--cyan)) bottom left/1px 24px,
linear-gradient(var(--cyan),var(--cyan)) bottom right/24px 1px,linear-gradient(var(--cyan),var(--cyan)) bottom right/1px 24px;
background-repeat:no-repeat}
#hud{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(88vw,460px);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;font:400 .78rem/1.3 'Share Tech Mono',ui-monospace,Menlo,monospace;color:var(--cyan);transition:opacity .6s}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;letter-spacing:.08em}
#pct{color:var(--white);font-size:1.9rem;letter-spacing:.04em;text-shadow:0 0 12px var(--cyan-glow)}
.bar{position:relative;height:9px;margin:7px 0 8px;border:1px solid var(--cyan-border);background:var(--bg-gradient);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 14px var(--cyan-glow)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(6,13,26,.8) 9px 10px)}
.meta{font-size:.66rem;color:var(--muted)}
body.exit #bg,body.exit #fx{opacity:0;transform:scale(1.06)}
body.exit #hud{opacity:0}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div id="frame"></div>
<div id="hud">
  <div class="row"><span id="status" aria-live="polite">01 / DATA INGESTION</span><b id="pct">000%</b></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row meta"><span id="mL">NODES 0000/0000</span><span id="mR">0x00000000</span></div>
  
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const bg=$('bg'),fx=$('fx'),bx=bg.getContext('2d'),cx=fx.getContext('2d');
const hud=$('hud'),pctEl=$('pct'),barEl=$('bar'),stEl=$('status'),mL=$('mL'),mR=$('mR');
const ENTER_URL="login.html";
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const T1=reduce?1.2:1.9, T2=reduce?1.2:1.7, HOLD=.9, PD=1.1;          // seconds: phase 1 (0-50%), phase 2 (50-100%)
const IW=610,IH=900,PAD=40;                           // logo source size, glow padding
const CH="01ABCDEF23456789ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ";
const PAL=['#0A4A9A','#078CFF','#00E5FF','#7FEAFF','#EAF2FA'];
let W,H,DPR,lx,ly,lw,lh,k,sz=2,cols,drops,lastRow,spd;
let N=0,nx,ny,bk,dl,sp,st,py,lt,glow,bs=[[],[],[],[],[]];
let tl=0,P=0,t=0,prev=0,fc=0,locked=0,rainV=1,nextPulse=0,flash=[],pulses=[];
let loaded=false,ready=false,snapped=false,exiting=false;
const ease=x=>.5-.5*Math.cos(Math.PI*Math.min(1,Math.max(0,x)));

function layout(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const c of [bg,fx]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);}
  bx.setTransform(DPR,0,0,DPR,0,0);cx.setTransform(DPR,0,0,DPR,0,0);
  const hh=hud.offsetHeight+30;
  lh=Math.max(120,Math.min(H-hh-36,W*.94*IH/IW,880));lw=lh*IW/IH;k=lw/IW;
  lx=(W-lw)/2;ly=Math.max(22,(H-hh-lh)/2+10);
  sz=Math.max(1.4,k*2.1);
  cols=Math.ceil(W/16);
  drops=Float32Array.from({length:cols},()=>Math.random()*H);
  lastRow=new Int32Array(cols).fill(-1);
  spd=Float32Array.from({length:cols},()=>110+Math.random()*250);
  bx.clearRect(0,0,W,H);
}

/* Shape extraction: read every pixel of the logo, build (a) a transparent-background
   copy + glow layer for the crisp render and (b) particle targets on the bright silhouette. */
const LUT=(()=>{const R=[[0,7,140,255],[.62,0,229,255],[1,234,250,255]],u=new Uint8Array(768);
  for(let l=0;l<256;l++){const t=l/255,s=t<.62?0:1,A=R[s],B=R[s+1],f=(t-A[0])/(B[0]-A[0]);for(let c=0;c<3;c++)u[l*3+c]=A[c+1]+(B[c+1]-A[c+1])*f;}
  return u;})();
function extract(img){
  const c=document.createElement('canvas');c.width=IW;c.height=IH;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0,IW,IH);
  const a=x.getImageData(0,0,IW,IH).data,out=x.createImageData(IW,IH),o=out.data,pp=[],pl=[];
  for(let y=0,i=0;y<IH;y++)for(let xx=0;xx<IW;xx++,i+=4){
    const l=.2126*a[i]+.7152*a[i+1]+.0722*a[i+2];
    const L=l|0;o[i]=LUT[L*3];o[i+1]=LUT[L*3+1];o[i+2]=LUT[L*3+2];o[i+3]=Math.min(1,Math.max(0,(l-70)/60))*255;
    if(l>115&&!(xx&1)&&!(y&1)){pp.push(xx,y);pl.push(l);}
  }
  x.putImageData(out,0,0);
  glow=document.createElement('canvas');glow.width=IW+2*PAD;glow.height=IH+2*PAD;
  const g=glow.getContext('2d');g.shadowColor='#00E5FF';g.shadowBlur=22;g.drawImage(c,PAD,PAD);g.shadowBlur=7;g.drawImage(c,PAD,PAD);
  const cap=W<600?5500:9500,keep=Math.min(1,cap/pl.length),idx=[];
  for(let j=0;j<pl.length;j++)if(Math.random()<keep)idx.push(j);
  N=idx.length;nx=new Float32Array(N);ny=new Float32Array(N);bk=new Uint8Array(N);dl=new Float32Array(N);
  sp=new Float32Array(N);st=new Uint8Array(N);py=new Float32Array(N);lt=new Float32Array(N);
  idx.forEach((j,n)=>{
    nx[n]=pp[2*j]/IW;ny[n]=pp[2*j+1]/IH;
    const b=Math.min(4,Math.floor((pl[j]-115)/28));bk[n]=b;bs[b].push(n);
    dl[n]=Math.random()*.6;sp[n]=1100+Math.random()*900;
  });
}

function rain(dt){
  rainV+=((ready?.25:1)-rainV)*Math.min(1,dt*1.6);
  bx.globalCompositeOperation='destination-out';bx.fillStyle='rgba(0,0,0,'+(.045+.055*rainV)+')';bx.fillRect(0,0,W,H);bx.globalCompositeOperation='source-over';
  bx.font='15px "Share Tech Mono",monospace';
  for(let i=0;i<cols;i++){
    drops[i]+=spd[i]*rainV*dt;
    const r=Math.floor(drops[i]/16);
    if(drops[i]>0&&r!==lastRow[i]){
      lastRow[i]=r;
      {const al=(.45+Math.random()*.5).toFixed(2);bx.fillStyle=Math.random()<.07?'#EAF2FA':Math.random()<.22?'rgba(7,140,255,'+al+')':'rgba(0,229,255,'+al+')';}
      bx.fillText(CH[Math.random()*CH.length|0],i*16,r*16);
    }
    if(drops[i]>H+60&&Math.random()<.03)drops[i]=-Math.random()*300;
  }
}

function scene(dt){
  cx.clearRect(0,0,W,H);
  const ph2=P>=50,sY=ph2?ly+lh*Math.min(1,(P-50)/50):-1,p1=Math.min(1,P/50),hs=H/900;
  if(N&&!ready){
    // Phase 1: particles fall as code rain and lock onto the extracted coordinates
    if(!ph2){
      for(let i=0;i<N;i++){
        if(st[i]===0){if(dl[i]<=p1){st[i]=1;py[i]=-Math.random()*60;}}
        else if(st[i]===1){py[i]+=sp[i]*hs*dt;if(py[i]>=ly+ny[i]*lh){st[i]=2;lt[i]=t;locked++;flash.push(i);}}
      }
    }else if(!snapped){for(let i=0;i<N;i++)if(st[i]!==2){st[i]=2;locked++;}snapped=true;}
    for(let b=0;b<5;b++){
      cx.fillStyle=PAL[b];cx.globalAlpha=.8+.2*Math.sin(t*4+b*1.7);
      for(const i of bs[b]){
        if(st[i]!==2)continue;
        const y=ly+ny[i]*lh;if(ph2&&y<sY)continue;
        cx.fillRect(lx+nx[i]*lw,y,sz,sz);
      }
    }
    cx.globalAlpha=1;
    if(!ph2){
      cx.fillStyle='rgba(0,229,255,.2)';
      for(let i=0;i<N;i++)if(st[i]===1)cx.fillRect(lx+nx[i]*lw,py[i]-28,sz,28);
      cx.fillStyle='#FFFFFF';
      for(let i=0;i<N;i++)if(st[i]===1)cx.fillRect(lx+nx[i]*lw,py[i],sz,sz*1.8);
      cx.fillStyle='#7FEAFF';cx.font='12px "Share Tech Mono",monospace';
      for(let i=0;i<N;i+=7)if(st[i]===1)cx.fillText(CH[Math.random()*CH.length|0],lx+nx[i]*lw-3,py[i]);
    }
    flash=flash.filter(i=>t-lt[i]<.3);
    cx.fillStyle='rgba(234,242,250,.85)';
    for(const i of flash)cx.fillRect(lx+nx[i]*lw-1,ly+ny[i]*lh-1,sz+2,sz+2);
  }
  if(ph2&&glow){
    // Phase 2: laser scanline solidifies the full glowing logo from top to bottom
    const gx=lx-PAD*k,gy=ly-PAD*k,gw=lw+2*PAD*k,gh=lh+2*PAD*k;
    cx.save();cx.beginPath();cx.rect(gx,gy,gw,Math.max(0,(ready?gy+gh:sY)-gy));cx.clip();
    cx.globalAlpha=ready?.9+.1*Math.sin(t*2.2):1;cx.drawImage(glow,gx,gy,gw,gh);cx.restore();
    if(!ready){
      const g=cx.createLinearGradient(0,sY-70,0,sY);
      g.addColorStop(0,'rgba(0,229,255,0)');g.addColorStop(1,'rgba(0,229,255,.3)');
      cx.fillStyle=g;cx.fillRect(lx-24,sY-70,lw+48,70);
      cx.save();cx.shadowColor='#00E5FF';cx.shadowBlur=20;cx.fillStyle='#FFFFFF';cx.fillRect(lx-24,sY-1,lw+48,2.5);cx.restore();
    }else{
      // Phase 3: energy pulse sweeps across the finished logo + expanding ring
      
      pulses=pulses.filter(p=>t-p<PD);
      const cX=lx+lw/2,cY=ly+lh*.45,R=Math.hypot(W,H)*.5;
      for(const p of pulses){
        const a=(t-p)/PD,bw=lw*.22,bxp=lx-bw+a*(lw+bw);
        cx.save();cx.beginPath();cx.rect(bxp,gy,bw,gh);cx.clip();
        cx.globalCompositeOperation='lighter';cx.globalAlpha=.85*Math.sin(Math.PI*a);cx.drawImage(glow,gx,gy,gw,gh);cx.restore();
        cx.save();cx.strokeStyle='rgba(0,229,255,'+Math.pow(1-a,1.6)*.7+')';cx.lineWidth=1.5+4*(1-a);
        cx.shadowColor='#00E5FF';cx.shadowBlur=16;cx.beginPath();cx.arc(cX,cY,a*R,0,6.2832);cx.stroke();cx.restore();
      }
    }
  }
}

function hudUpdate(){
  pctEl.textContent=String(Math.floor(P)).padStart(3,'0')+'%';
  barEl.style.width=P+'%';
  if(!ready){
    const s=P<25?'01 / DATA INGESTION':P<50?'02 / STRUCTURE ASSEMBLY':'03 / SYSTEM RENDERING';
    if(stEl.textContent!==s)stEl.textContent=s;
  }
  if(fc++%6===0){
    mL.textContent=ready?'ALL NODES LOCKED':P<50?'NODES '+String(locked).padStart(4,'0')+'/'+String(N).padStart(4,'0'):'SCAN '+Math.round((P-50)*2)+'%';
    mR.textContent='0x'+((Math.random()*0xffffffff)>>>0).toString(16).padStart(8,'0').toUpperCase();
  }
}

function frame(now){
  const dt=Math.min(.05,(now-prev)/1000||0);prev=now;t+=dt;
  if(loaded&&!ready){
    tl+=dt;
    P=tl<T1?50*ease(tl/T1):Math.min(100,50+50*ease((tl-T1)/T2));
    if(P>=100){
      P=100;ready=true;pulses.push(t);stEl.textContent='SYSTEM READY';
      setTimeout(enterSite,HOLD*1000);
    }
  }
  rain(dt);scene(dt);hudUpdate();
  requestAnimationFrame(frame);
}

function restart(){
  tl=0;P=0;ready=false;snapped=false;locked=0;flash=[];pulses=[];exiting=false;
  if(st)st.fill(0);
  document.body.classList.remove('exit');
}
function enterSite(){
  if(exiting)return;exiting=true;document.body.classList.add('exit');
  setTimeout(()=>{ENTER_URL?location.href=ENTER_URL:restart();},500);
}

const img=new Image();
