<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Search — CS Data</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink&family=Instrument+Serif:ital@0;1&family=Grechen+Fuemen&family=Karla:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <canvas id="matrixCanvas"></canvas>

  <button class="menu-toggle-btn" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>

  <div class="page">
    <div id="topbarPlaceholder"></div>

    <section class="container">
      <div class="hero" style="padding:30px 28px">
        <div class="hero-content">
          <h1>🔍 Smart Search</h1>
          <p>Search by doctor or subject name</p>
        </div>
      </div>

      <div class="field" style="max-width:600px;margin:0 auto 32px">
        <input type="text" id="searchInput" placeholder="🔍 Type a doctor or subject name..." autofocus>
      </div>

      <div id="results">
        <div class="text-center text-muted" style="padding:60px">✨ Start typing to search</div>
      </div>
    </section>

    <div id="footerPlaceholder"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mappers.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mockApi.js" defer></script>
  <script src="js/matrix.js" defer></script>
  <script src="js/topbar.js" defer></script>
  <script src="js/pages/search.js" defer></script>
</body>
</html>
