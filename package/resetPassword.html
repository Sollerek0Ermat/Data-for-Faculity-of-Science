<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset Password — CS Data</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Karla:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="preload" href="style.css" as="style">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <div class="page">
    <div id="topbarPlaceholder"></div>

    <div class="login-wrap" style="flex:1">
      <div class="login-card">
        <div class="login-icon">🔄</div>
        <h1>Reset Your Password</h1>
        <p>Microsoft account verified. Enter your new admin password.</p>

        <form id="setPwdForm">
          <div class="field">
            <label for="newPwd">New Password</label>
            <input type="password" id="newPwd" placeholder="••••••••" required minlength="8">
          </div>

          <div class="field">
            <label for="confirmPwd">Confirm Password</label>
            <input type="password" id="confirmPwd" placeholder="••••••••" required minlength="8">
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="height:52px;font-size:16px">
            Update Password →
          </button>

          <p id="msg" class="text-center" style="margin-top:12px;font-weight:700;font-size:14px;min-height:20px"></p>
        </form>

        <div style="text-align:center;margin-top:20px">
          <a href="admin-login.html" style="color:var(--muted);font-size:13px;font-weight:600">← Back to Admin Login</a>
        </div>
      </div>
    </div>

    <div id="footerPlaceholder"></div>
  </div>

  <script src="js/config.js"              defer></script>
  <script src="js/i18n.js"                defer></script>
  <script src="js/helpers.js"             defer></script>
  <script src="js/ui.js"                  defer></script>
  <script src="js/auth.js"                defer></script>
  <script src="js/mappers.js"             defer></script>
  <script src="js/api.js"                 defer></script>
  <script src="js/matrix.js"              defer></script>
  <script src="js/topbar.js"              defer></script>
  <script src="js/pages/setPassword.js"   defer></script>
</body>
</html>
