<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard — CS Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Karla:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <div class="page">
    <div id="topbarPlaceholder"></div>

    <section class="container">
      <div class="hero hero-home" style="min-height:180px;padding:24px 4%">
        <div class="hero-content" style="width:100%;text-align:left">
          <h1 id="welcomeTitle" style="font-size:clamp(24px,3vw,36px)">👋 Welcome</h1>
          <p id="userRole">Loading...</p>
        </div>
      </div>
    </section>

    <div class="container">
      <!-- Tabs -->
      <div class="tabs" id="adminTabs" style="flex-wrap:wrap;gap:6px;margin-bottom:20px">
        <button class="tab active" data-tab="overview">📊 Overview</button>
        <button class="tab" data-tab="content">📚 Content</button>
        <button class="tab" data-tab="structure">🏛️ Structure</button>
        <button class="tab" data-tab="doctors">👨‍🏫 Doctors</button>
        <button class="tab" data-tab="users">👥 Users</button>
      </div>

      <!-- ═══════════════════════════════════════════ -->
      <!-- TAB: Overview                                -->
      <!-- ═══════════════════════════════════════════ -->
      <div class="tab-content" id="tab-overview">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="table-wrap" style="padding:20px;margin-top:20px">
          <h2 style="font-size:16px;font-weight:800;margin-bottom:14px;color:var(--cyan)">📋 Quick Stats</h2>
          <div id="quickStats"></div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════ -->
      <!-- TAB: Content — الشجرة الهرمية               -->
      <!-- ═══════════════════════════════════════════ -->
      <div class="tab-content hidden" id="tab-content">
        <div class="table-wrap" style="padding:20px;margin-bottom:16px">
          <nav class="breadcrumbs" id="contentBreadcrumbs" style="margin:0"></nav>
        </div>

        <div class="table-wrap" style="padding:20px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
            <h2 id="contentTitle" style="font-size:18px;font-weight:800;color:var(--cyan)">🏛️ Departments</h2>
            <div id="contentActions"></div>
          </div>
          <div id="contentGrid"></div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════ -->
      <!-- TAB: Structure                              -->
      <!-- ═══════════════════════════════════════════ -->
      <div class="tab-content hidden" id="tab-structure">
        <div class="table-wrap" style="padding:20px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
            <h2 style="font-size:16px;font-weight:800;color:var(--cyan)">🏛️ Departments</h2>
            <button class="btn btn-primary btn-sm" data-action="openAddDepartment">➕ Add Department</button>
          </div>
          <div id="deptsList"></div>
        </div>

        <div class="table-wrap" style="padding:20px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
            <h2 style="font-size:16px;font-weight:800;color:var(--cyan)">📊 Levels</h2>
            <button class="btn btn-primary btn-sm" data-action="openAddLevel">➕ Add Level</button>
          </div>
          <div id="levelsList"></div>
        </div>

        <div class="table-wrap" style="padding:20px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
            <h2 style="font-size:16px;font-weight:800;color:var(--cyan)">📅 Semesters</h2>
            <button class="btn btn-primary btn-sm" data-action="openAddSemester">➕ Add Semester</button>
          </div>
          <div id="semestersList"></div>
        </div>

        <div class="table-wrap" style="padding:20px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
            <h2 style="font-size:16px;font-weight:800;color:var(--cyan)">📖 Subjects</h2>
            <button class="btn btn-primary btn-sm" data-action="openAddSubject">➕ Add Subject</button>
          </div>
          <div id="subjectsList"></div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════ -->
      <!-- TAB: Doctors                                -->
      <!-- ═══════════════════════════════════════════ -->
      <div class="tab-content hidden" id="tab-doctors">
        <div class="table-wrap" style="padding:20px;margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
            <h2 style="font-size:16px;font-weight:800;color:var(--cyan)">👨‍🏫 All Doctors</h2>
            <button class="btn btn-primary btn-sm" data-action="openAddDoctor">➕ Add Doctor</button>
          </div>
          <div id="doctorsList2"></div>
        </div>

        <div class="table-wrap" style="padding:20px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
            <h2 style="font-size:16px;font-weight:800;color:var(--cyan)">🔗 Doctor ↔ Subject Links</h2>
            <button class="btn btn-primary btn-sm" data-action="openLinkDoctor">➕ Link Doctor</button>
          </div>
          <div id="linksList"></div>
        </div>
      </div>

      <!-- ═══════════════════════════════════════════ -->
      <!-- TAB: Users                                  -->
      <!-- ═══════════════════════════════════════════ -->
      <div class="tab-content hidden" id="tab-users">
        <div class="table-wrap" style="padding:20px">
          <h2 style="font-size:16px;font-weight:800;color:var(--cyan);margin-bottom:14px">👥 Manage Users</h2>

          <div class="field">
            <label>Emails (one per line)</label>
            <textarea id="userEmails" rows="4" placeholder="student@science.tanta.edu.eg"></textarea>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
            <div class="field">
              <label>Role</label>
              <select id="userRole">
                <option value="user">User</option>
                <option value="doctor">Doctor</option>
                <option value="moderator">Moderator</option>
                <option value="owner">Owner</option>
              </select>
            </div>
            <div class="field">
              <label>Department</label>
              <input type="text" id="userDept" placeholder="computer science">
            </div>
            <div class="field">
              <label>Level</label>
              <input type="number" id="userLevel" value="1">
            </div>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <button class="btn btn-primary btn-sm" data-action="changeRole">🔄 Change Role</button>
            <button class="btn btn-success btn-sm" data-action="changeLockTrue">🔒 Lock</button>
            <button class="btn btn-ghost btn-sm" data-action="changeLockFalse">🔓 Unlock</button>
          </div>
        </div>
      </div>

    </div>

    <div id="footerPlaceholder"></div>
  </div>

  <!-- Modal Placeholder -->
  <div id="modalRoot"></div>

  <script src="js/config.js"          defer></script>
  <script src="js/i18n.js"            defer></script>
  <script src="js/helpers.js"         defer></script>
  <script src="js/ui.js"              defer></script>
  <script src="js/auth.js"            defer></script>
  <script src="js/mappers.js"         defer></script>
  <script src="js/api.js"             defer></script>
  <script src="js/matrix.js"          defer></script>
  <script src="js/topbar.js"          defer></script>
  <script src="js/pages/admin.js"     defer></script>
</body>
</html>
