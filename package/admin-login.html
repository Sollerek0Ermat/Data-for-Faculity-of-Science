<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin Login - CS Data</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&family=Karla:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="preload" href="style.css" as="style">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <div class="page">
    <div id="topbarPlaceholder"></div>

    <div class="login-wrap" style="flex:1">
      <div class="login-card">
        <div class="login-icon">A</div>
        <h1>Admin Access</h1>
        <p id="subTitle">Enter your credentials</p>

        <div id="step2">
          <form id="pwdForm">
            <div class="field">
              <label for="adminEmail">Email</label>
              <input type="email" id="adminEmail" placeholder="you@science.tanta.edu.eg" required>
            </div>
            <div class="field">
              <label for="adminPwd">Admin Password</label>
              <input type="password" id="adminPwd" placeholder="Enter password" required minlength="8">
            </div>
            <p style="font-size:12px;color:var(--muted);margin-bottom:12px" id="pwdHint">
              First time? Enter a new password to set it. Otherwise, enter your existing password.
            </p>
            <button type="submit" class="btn btn-primary btn-block" id="submitBtn" style="height:52px">
              Continue
            </button>
          </form>
          <p id="msg" class="text-center" style="margin-top:12px;font-weight:700;font-size:14px;min-height:20px"></p>
        </div>

        <div style="text-align:center;margin-top:20px">
          <a href="index.html" style="color:var(--muted);font-size:13px;font-weight:600">Back to Home</a>
        </div>
      </div>
    </div>

    <div id="footerPlaceholder"></div>
  </div>

  <script src="js/config.js"        defer></script>
  <script src="js/i18n.js"          defer></script>
  <script src="js/helpers.js"       defer></script>
  <script src="js/ui.js"            defer></script>
  <script src="js/auth.js"          defer></script>
  <script src="js/mappers.js"       defer></script>
  <script src="js/api.js"           defer></script>
  <script src="js/matrix.js"        defer></script>
  <script src="js/topbar.js"        defer></script>
  <script src="js/pages/admin-login.js" defer></script>
</body>
</html>
